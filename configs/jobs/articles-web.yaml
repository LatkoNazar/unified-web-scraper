name: articles
content_profile: generic
assessment_profile: generic
sources: []
search: Знайди статті про історію міст. Збери назву, автора, дату публікації, опис, текст і URL.
schema_path: ../schemas/article.schema.json
outputs: [jsonl, parquet]
discovery:
  enabled: true
  max_queries: 1
  search_results: 5
  max_sites: 3
  pages_per_site: 5
  search_context_size: low
crawl:
  backend: browser
  max_pages: 15
  max_records: 10
  max_depth: 3
  concurrency: 1
ai:
  routing: hybrid
  reasoning: false
  max_calls: 30
navigation:
  mode: hybrid
  allow_filters: false
